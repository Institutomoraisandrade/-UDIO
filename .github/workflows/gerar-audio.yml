name: Gerar aula MASTER E-sports e Saude

on:
  workflow_dispatch:
    inputs:
      voice:
        description: "Voz neural"
        required: true
        default: "pt-BR-AntonioNeural"
      rate:
        description: "Velocidade"
        required: true
        default: "+20%"

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Montar aula completa
        run: |
          cat roteiros/esports-master-parte-1.txt roteiros/esports-master-parte-2.txt roteiros/esports-master-parte-3.txt roteiros/esports-master-parte-4.txt roteiros/esports-master-parte-5.txt > roteiros/aula-master-esports-saude.txt
          wc -w roteiros/aula-master-esports-saude.txt
      - name: Gerar MP3
        run: |
          mkdir -p output
          python src/generate.py --input roteiros/aula-master-esports-saude.txt --output output/Aula_MASTER_ESPORTS_SAUDE.mp3 --voice "${{ inputs.voice }}" --rate="${{ inputs.rate }}" --pitch="+0Hz"
      - name: Validar
        run: test -s output/Aula_MASTER_ESPORTS_SAUDE.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: Aula-MASTER-ESPORTS-SAUDE
          path: output/Aula_MASTER_ESPORTS_SAUDE.mp3
          if-no-files-found: error
          retention-days: 7
