name: Gerar audio neural

on:
  workflow_dispatch:
    inputs:
      voice:
        description: "Voz neural"
        required: true
        default: "pt-BR-AntonioNeural"
      rate:
        description: "Velocidade"
        required: true
        default: "-5%"

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Edge TTS
        run: pip install -r requirements.txt

      - name: Gerar MP3
        run: |
          mkdir -p output
          python src/generate.py --input roteiros/teste.txt --output output/teste-antonio.mp3 --voice "${{ inputs.voice }}" --rate="${{ inputs.rate }}" --pitch="+0Hz"

      - name: Validar arquivo
        run: |
          test -s output/teste-antonio.mp3
          ls -lh output/teste-antonio.mp3

      - name: Publicar MP3
        uses: actions/upload-artifact@v4
        with:
          name: teste-voz-antonio-ptbr
          path: output/teste-antonio.mp3
          if-no-files-found: error
          retention-days: 7
