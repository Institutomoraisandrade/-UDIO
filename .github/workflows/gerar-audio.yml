name: Gerar aula completa AMI e inibicao

on:
  workflow_dispatch:
    inputs:
      voice:
        description: "Voz neural"
        required: true
        default: "pt-BR-AntonioNeural"
      rate:
        description: "Velocidade"
        required: true
        default: "-5%"

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Edge TTS
        run: pip install -r requirements.txt

      - name: Montar roteiro completo
        run: |
          cat roteiros/aula-final-parte-1.txt roteiros/aula-final-parte-2.txt roteiros/aula-final-parte-3.txt roteiros/aula-final-parte-4.txt > roteiros/aula-final-completa.txt
          wc -w roteiros/aula-final-completa.txt

      - name: Gerar MP3 completo
        run: |
          mkdir -p output
          python src/generate.py --input roteiros/aula-final-completa.txt --output output/aula-AMI-inibicao-completa.mp3 --voice "${{ inputs.voice }}" --rate="${{ inputs.rate }}" --pitch="+0Hz"

      - name: Validar arquivo
        run: |
          test -s output/aula-AMI-inibicao-completa.mp3
          ls -lh output/aula-AMI-inibicao-completa.mp3

      - name: Publicar aula
        uses: actions/upload-artifact@v4
        with:
          name: aula-AMI-inibicao-AntonioNeural
          path: output/aula-AMI-inibicao-completa.mp3
          if-no-files-found: error
          retention-days: 7
