name: Gerar aula PICS e Yoga

on:
  workflow_dispatch:
    inputs:
      voice:
        description: "Voz neural"
        required: true
        default: "pt-BR-AntonioNeural"
      rate:
        description: "Velocidade"
        required: true
        default: "+20%"

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Edge TTS
        run: pip install -r requirements.txt
      - name: Montar roteiro
        run: |
          cat roteiros/pics-yoga-parte-1.txt roteiros/pics-yoga-parte-2.txt roteiros/pics-yoga-parte-3.txt > roteiros/aula-pics-yoga-completa.txt
          wc -w roteiros/aula-pics-yoga-completa.txt
      - name: Gerar MP3
        run: |
          mkdir -p output
          python src/generate.py --input roteiros/aula-pics-yoga-completa.txt --output output/aula-PICS-Yoga-biopsicossocial.mp3 --voice "${{ inputs.voice }}" --rate="${{ inputs.rate }}" --pitch="+0Hz"
      - name: Validar
        run: |
          test -s output/aula-PICS-Yoga-biopsicossocial.mp3
          ls -lh output/aula-PICS-Yoga-biopsicossocial.mp3
      - name: Publicar
        uses: actions/upload-artifact@v4
        with:
          name: aula-PICS-Yoga-biopsicossocial
          path: output/aula-PICS-Yoga-biopsicossocial.mp3
          if-no-files-found: error
          retention-days: 7
