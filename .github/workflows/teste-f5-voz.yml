name: Teste B - F5 PT-BR voz Daniel

on:
  workflow_dispatch:

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Dependencias do sistema
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Validar referencia
        run: |
          test -s voice_refs/voz_daniel_master.mp3 || (echo "Falta voice_refs/voz_daniel_master.mp3" && exit 2)
      - name: Instalar F5-TTS PT-BR
        run: |
          git clone --depth 1 https://github.com/Cataldir/f5-tts-pt-br.git /tmp/f5ptbr
          pip install -U pip
          pip install -e /tmp/f5ptbr
      - name: Preparar referencia
        run: |
          mkdir -p output
          ffmpeg -y -i voice_refs/voz_daniel_master.mp3 -ac 1 -ar 24000 /tmp/voz_daniel_ref.wav
      - name: Gerar clonagem F5
        run: |
          python scripts/test_f5_ptbr.py             --ref /tmp/voz_daniel_ref.wav             --text voice_tests/teste_comparativo.txt             --out output/TESTE_B_F5_DANIEL.wav             --speed 1.03
          ffmpeg -y -i output/TESTE_B_F5_DANIEL.wav -codec:a libmp3lame -b:a 192k output/TESTE_B_F5_DANIEL.mp3
      - name: Validar
        run: test -s output/TESTE_B_F5_DANIEL.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: TESTE-B-F5-DANIEL
          path: output/TESTE_B_F5_DANIEL.mp3
          retention-days: 7
